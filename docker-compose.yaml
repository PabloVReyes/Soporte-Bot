services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./Backend
    container_name: backend_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./session:/auth
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    command: ["yarn", "start"] # o "yarn", "dev" para desarrollo

  frontend:
    build:
      context: ./Frontend
    container_name: frontend_app
    restart: always
    env_file:
      - .env
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
